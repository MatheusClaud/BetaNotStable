<i (click)="close()" class="dialog-close-btn bi bi-x-lg"></i>
<div style="justify-content: space-around;" class="dialog-container">
    <div style="height: 40px;" class="create-store-header center">
        <h2>Edite as imagens selecionadas</h2>
    </div>

    <div class="col" style="align-items: center; min-height: 200px; width: 90%; height: calc(90% - 80px); margin-bottom: 30px; margin-top: 30px;">
        <image-cropper
            style="width: 90%; border-radius: 8px;"
            [maintainAspectRatio]="true"
            [aspectRatio]="width / height"
            [resizeToHeight]="height"
            [resizeToWidth]="width"
            [onlyScaleDown]="true"
            [imageFile]="indexedData()[selectedIndex()]"
            (imageCropped)="imageCropped($event)"
        ></image-cropper>

        <button (click)="cutImage()" style="max-width: 200px; width: 30%; margin-top: 10px;" class="form-btn" type="submit" >
            Cortar imagem {{ selectedIndex() + 1 }}
        </button>  


        <div class="col" style="padding: 20px; overflow-y: scroll; margin-top: 10px; width: 90%; gap: 15px; min-height: 100px; border: 1px solid #282828; border-radius: 8px;">
            @for(image of getItemsInDisplay(); track image; let index = $index) {
                <div style="margin-left: 10px;">
                    <div class="row" style="width: 100%;" >
                        <div (click)="setSelectedIndex(index);" class="font-2 highlight-option">{{ index + 1 }}. {{ image.name | truncateFilename }} </div>
                        @if(resultList().get(indexedData()[index].name)?.blob !== null) {
                            <i style="margin-left: 10px; color: green;" class="bi bi-check-circle-fill"></i>
                        }
                        <i (click)="deleteItem(index)" style="cursor: pointer; margin-left: auto;" class="bi bi-trash-fill"></i>
                    </div>
                </div>
            }
        </div>
    </div>

    <div style="height: 40px; justify-content: end; width: 100%; gap: 20px; margin-right: 40px;" class="row">
        <button (click)="close()" style="max-width: 200px; width: 30%;" class="form-btn" type="submit" >
            Cancelar
        </button>  
        <button (click)="saveImages()" [disabled]="!areAllImagesSelected()" style="max-width: 200px; width: 30%;" class="form-btn" type="submit" >
            Salvar
        </button>  
    </div>
</div>
