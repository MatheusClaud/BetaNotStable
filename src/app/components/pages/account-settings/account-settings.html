<div class="col centered settings-container">
    <div
       class="settings-content-card"
    >
        <div
            class="row centered"
            style=
            "
                height: 100%;
                width: 100%;
                background-color: white;
                border: 1px solid #28282B;
                border-radius: 4px;
                color: #28282B;
            "
        >
            <div class="side-nav-control col" style="border-right: #28282B solid 1px; height: 100%; width: 250px;">
                
                <div class="col centered" style="border-bottom: #28282B solid 1px; width: 100%; margin: 0; padding: 0;">
                    <!-- <img 
                        src="https://assets.multiplan.com.br/Multiplan/filer_public/5d/bf/5dbf4a5a-8442-4eab-8bf8-880d87631c57/lupo.webp" 
                        alt="Default profile picture" 
                        style="margin-top: 45px; border-radius: 50%; width: 100px; height: 100px; object-fit: cover; border: #28282B solid 1px;"
                    > -->
                    <div class="col centered" style="margin-top: 45px; border-radius: 50%; width: 100px; height: 100px; border: #28282B solid 1px;">
                        <i style="margin-left: 5px; font-size: 55px" class="bi bi-person-check-fill"></i>
                    </div>

                    
                    <div class="font-2" style="font-size: 18px; margin-top: 10px; padding: 15px; text-align: center;">
                        {{ loggedUser()?.name }} 
                    </div>

                </div>

                <div style="padding: 25px; overflow-y: scroll;">
                    <div class="font-2-bold-2"> Opções: </div>
                    <div style="margin-left: 15px;">
                        <div class="font-2 highlight-option" routerLink="profile"> Editar usuário </div>
                        <div class="font-2 highlight-option" routerLink="update-password"> Mudar senha </div>
                        <!-- <div class="font-2 highlight-option" routerLink="signatures"> Assinaturas </div> -->
                        <div class="font-2 highlight-option" routerLink="my-stores"> Minhas lojas </div>
                    </div>

                    @if (storeService.storeToEdit() !== null) {
                        <div style="margin-top: 25px;" class="font-2-bold-2"> ({{storeService.storeToEdit()?.name}}): </div>
                        <div style="margin-left: 15px;">
                            <!-- <div class="font-2 highlight-option" routerLink="edit-store"> Editar dados da loja </div> -->
                            <!-- <div class="font-2 highlight-option" routerLink="remove-store"> Remover loja </div> -->
                            <!-- <div class="font-2 highlight-option" routerLink="categories"> Categorias </div> -->
                            <div class="font-2 highlight-option" routerLink="products/"> Produtos </div>
                            <!-- <div class="font-2 highlight-option" routerLink="catalogs"> Catalogos </div> -->
                        </div>
                    }
                    
                </div>
            </div>
            <div class="content-control">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
